  <meta name="description" content="Request a vessel charter, shipbuilding quote, or marine support from AGM.">
  <link rel="shortcut icon" href="/en/favicon.png">
  <link rel="preload" href="/hubfs/fonts/agm/dm-sans-300_700-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/hubfs/fonts/agm/source-serif-4-300_700-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/hubfs/fonts/agm/agm-fonts.css?v=3">
<link rel="stylesheet" href="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-brand.css?v=13">
<link rel="stylesheet" href="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-mobile.css?v=7">
  <link rel="stylesheet" href="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-appbar.css?v=18">
  <link rel="stylesheet" href="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-pages.css?v=26">

<body class="agm-page">
  <main class="agm-page-main">
    <header class="agm-page-hero">
      <p class="agm-kicker" data-i18n="pg.enq.k">Enquire</p>
      <h1 data-i18n="pg.enq.h" data-i18n-html>Tell us what<br>you need</h1>
      <p class="agm-lede" data-i18n="pg.enq.l">Charter dates, a new hull, or yard work — send the details and we will reply.</p>
    </header>
    
    <form class="agm-form" action="/api/enquire.php" method="post">
      <label>Your name<input name="name" required autocomplete="name" maxlength="120"></label>
      <label>Your email<input type="email" name="email" required autocomplete="email" maxlength="180"></label>
      <label>Your phone<input type="tel" name="phone" autocomplete="tel" maxlength="60"></label>
      <label>What do you need?
        <select name="service">
          <option value="Vessel charter">Vessel charter</option>
          <option value="FRP shipbuilding">FRP shipbuilding</option>
          <option value="Marine support">Marine support</option>
          <option value="Repair &amp; maintenance">Repair &amp; maintenance</option>
        </select>
      </label>
      <label>Tell us more<textarea name="message" required maxlength="4000" placeholder="Dates, passenger count, or build requirements"></textarea></label>
      <label class="agm-form-honey" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
      <p class="agm-form-status" role="status" aria-live="polite" hidden></p>
      <button class="agm-btn agm-btn-solid" type="submit" data-i18n="form.send">Send message</button>
    </form>
  </main>
</body>
</html>
