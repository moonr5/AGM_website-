<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cookie Manager — PT. Agara Global Maritim</title>
  <meta name="description" content="Choose which cookies PT. Agara Global Maritim may use on this device.">
  <link rel="shortcut icon" href="/en/favicon.png">
  <link rel="preload" href="/hubfs/fonts/agm/dm-sans-300_700-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/hubfs/fonts/agm/source-serif-4-300_700-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/hubfs/fonts/agm/agm-fonts.css?v=3">
  <link rel="stylesheet" href="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-brand.css?v=13">
  <link rel="stylesheet" href="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-mobile.css?v=7">
  <link rel="stylesheet" href="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-appbar.css?v=12">
  <link rel="stylesheet" href="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-pages.css?v=25">
  <script defer src="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-mobile.js?v=6"></script>
  <script defer src="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-i18n.js?v=9"></script>
  <script defer src="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-pages.js?v=21"></script>
  <script defer src="/hubfs/raw_assets/homepage/179/js_client_assets/assets/agm-cookies.js?v=3"></script>
</head>
<body class="agm-page">
  <main class="agm-page-main">
    <header class="agm-page-hero">
      <p class="agm-kicker" data-i18n="pg.cm.k">Cookie Manager</p>
      <h1 data-i18n="pg.cm.h" data-i18n-html>Choose what<br>this site may store</h1>
      <p class="agm-lede" data-i18n="pg.cm.l">Necessary cookies stay on so the site and the forms work. Analytics and marketing wait for your say.</p>
    </header>

    <form class="agm-cookie-panel" id="agm-cookie-form">
      <label class="agm-cookie-row is-locked">
        <span>
          <strong>Necessary</strong>
          <small>Preference, security, and the enquiry forms. Always on.</small>
        </span>
        <input type="checkbox" checked disabled>
      </label>
      <label class="agm-cookie-row">
        <span>
          <strong>Analytics</strong>
          <small>Helps us see which pages are used. Off until you allow it.</small>
        </span>
        <input type="checkbox" name="analytics" id="agm-cookie-analytics">
      </label>
      <label class="agm-cookie-row">
        <span>
          <strong>Marketing</strong>
          <small>Not in use today. Stays off unless you switch it on.</small>
        </span>
        <input type="checkbox" name="marketing" id="agm-cookie-marketing">
      </label>
      <p class="agm-form-status" id="agm-cookie-status" role="status" aria-live="polite" hidden></p>
      <div class="agm-cta-row">
        <button class="agm-btn agm-btn-solid" type="submit">Save choices</button>
        <a class="agm-btn" href="/en/cookie-policy/">Read the policy</a>
      </div>
    </form>
  </main>
</body>
</html>
